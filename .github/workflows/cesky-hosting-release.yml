name: Build production package for Cesky hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, fileinfo
          coverage: none
      - name: Validate assessment PHP and scoring
        run: |
          php -l api/obtiznost.php
          php -l api/obtiznost-lib.php
          php -d zend.assertions=1 -d assert.exception=1 tests/obtiznost.test.php
      - name: Install PDF library
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Smoke test JavaScript and PDF export
        run: |
          node --check assessment.js
          php -d zend.assertions=1 -d assert.exception=1 tests/obtiznost-pdf.test.php
      - name: Build production pages
        run: python3 build.py --production
      - name: Validate output
        run: |
          python3 - <<'PYCHK'
          from pathlib import Path
          root = Path('release')
          files = ['index.html', 'kongres.html', 'kalendar.html', 'vzdelavani.html', 'english.html', 'prihlaska.html', 'obchodni-podminky.html', 'podminky-ochrany-osobnich-udaju.html', 'api/clenstvi.php', 'api/obtiznost.php', 'obtiznost.html', 'assessment.js', 'assessment.css', 'vendor/autoload.php', '.htaccess', 'sitemap.xml', 'robots.txt']
          missing = [name for name in files if not (root / name).is_file()]
          if missing:
              raise SystemExit('Missing production files: ' + ', '.join(missing))
          index = (root / 'index.html').read_text(encoding='utf-8')
          congress = (root / 'kongres.html').read_text(encoding='utf-8')
          english = (root / 'english.html').read_text(encoding='utf-8')
          assert '24.–25. září 2027' in index
          assert 'href="obtiznost.html"' in index
          assert 'assets/assessment/questions.json' in (root / 'assessment.js').read_text(encoding='utf-8')
          assert 'Odeslání výsledků e-mailem' in (root / 'obtiznost.html').read_text(encoding='utf-8')
          assert '20270924' in congress and '20270926' in congress
          camilleri = (root / 'camilleri.html').read_text(encoding='utf-8')
          assert 'href="obchodni-podminky.html"' in camilleri
          assert 'href="podminky-ochrany-osobnich-udaju.html"' in camilleri
          assert 'kongres.endodont.cz/obchodni-podminky' not in camilleri
          terms = (root / 'obchodni-podminky.html').read_text(encoding='utf-8')
          privacy = (root / 'podminky-ochrany-osobnich-udaju.html').read_text(encoding='utf-8')
          assert 'Verze 1.1' in terms and 'VIII. Řešení sporů' in terms
          assert 'Verze 1.1' in privacy and 'V. Vaše práva' in privacy
          assert 'href="obchodni-podminky.html"' in index
          assert '24–25 September 2027' in english
          assert '17.–18. září 2027' not in congress
          assert '<meta name="robots" content="index,follow">' in index
          assert '<link rel="canonical" href="https://www.endodont.cz/">' in index
          assert 'https://www.endodont.cz/' in (root / 'sitemap.xml').read_text(encoding='utf-8')
          redirects = (root / '.htaccess').read_text(encoding='utf-8')
          assert 'RewriteCond %{HTTP_HOST} ^endodont\\.cz$ [NC,OR]' in redirects
          assert 'https://www.endodont.cz%{REQUEST_URI}' in redirects
          assert 'https://endodont.cz%{REQUEST_URI}' not in redirects

          print('Validated', sum(1 for _ in root.rglob('*') if _.is_file()), 'production files')
          PYCHK
      - name: Package webroot including dotfiles
        run: cd release && zip -r -q ../ces-endodont-production.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ces-endodont-production
          path: ces-endodont-production.zip
          if-no-files-found: error
          retention-days: 30
